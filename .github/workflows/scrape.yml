name: scrape

on:
  schedule:
    - cron: "0 */6 * * *"   # 6 tiếng/lần (giờ UTC)
  workflow_dispatch:         # cho phép bấm "Run workflow" chạy tay

permissions:
  contents: write

concurrency: scrape          # lần chạy sau đợi lần trước xong, không chạy chồng

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scrape.py
      # vẫn lưu kết quả các nguồn khác dù có nguồn lỗi.
      # Cào mất vài phút; trong lúc đó jobs.json trên GitHub có thể đã đổi (commit từ máy) → lấy bản mới nhất về
      # rồi gộp bằng merge() của scrape.py, thay vì rebase file JSON (dễ xung đột).
      - if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp jobs.json "$RUNNER_TEMP/new.json"
          git checkout jobs.json
          git pull --ff-only
          python -c "import sys, scrape; scrape.save('jobs.json', scrape.merge(scrape.load('jobs.json'), scrape.load(sys.argv[1])), scrape.load(sys.argv[1], 'rejected'))" "$RUNNER_TEMP/new.json"
          git add jobs.json
          git diff --cached --quiet || (git commit -m "update jobs" && git push)
