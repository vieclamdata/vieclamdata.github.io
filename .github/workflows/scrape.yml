name: scrape

on:
  schedule:
    - cron: "0 */6 * * *"   # 6 tiếng/lần (giờ UTC)
  workflow_dispatch:         # cho phép bấm "Run workflow" chạy tay

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scrape.py
      # vẫn lưu kết quả các nguồn khác dù có nguồn lỗi
      - if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add jobs.json
          git diff --cached --quiet || (git commit -m "update jobs" && git pull --rebase && git push)
